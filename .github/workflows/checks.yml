name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  local-model:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: python3 -m pip install --user --break-system-packages -r scripts/requirements-review.txt
      - run: bash scripts/quick-check.sh
