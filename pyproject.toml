[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cc-contract"
version = "0.1.0"
description = "Experimental contract-guided host-device sequence testing"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
cc-contract = "cc_contract.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
